<style>
  /* Sizes are in Word-window units (u). On a computer, 1u is half a pixel,
     so the window is real Mac Word size at 100%, and it grows on big screens. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #ffffff;
    display: grid;
    place-items: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #1c1c1e; }
  }

  .win {
    --u: min(calc((100vw - 48px) / 1400), max(0.5px, calc((100vh - 48px) / 1898)));
    width: calc(var(--u) * 1400);
    height: min(calc(var(--u) * 1898), calc(100vh - 48px));
    display: flex;
    flex-direction: column;
    border-radius: calc(var(--u) * 52);
    overflow: hidden;
    background: #f5f5f5;
    box-shadow:
      0 calc(var(--u) * 24) calc(var(--u) * 100) rgba(0, 0, 0, 0.42),
      0 0 0 calc(var(--u) * 1) rgba(0, 0, 0, 0.16);
    user-select: none;
    -webkit-user-select: none;
  }
  @supports (height: 100dvh) {
    body { min-height: 100dvh; }
    .win {
      --u: min(calc((100vw - 48px) / 1400), max(0.5px, calc((100dvh - 48px) / 1898)));
      height: min(calc(var(--u) * 1898), calc(100dvh - 48px));
    }
  }

  .el {
    position: absolute;
    left: calc(var(--u) * var(--x, 0));
    top: calc(var(--u) * var(--y, 0));
    width: calc(var(--u) * var(--w));
    height: calc(var(--u) * var(--h));
  }
  .t {
    position: absolute;
    left: calc(var(--u) * var(--x));
    top: calc(var(--u) * var(--cy));
    transform: translateY(-50%);
    font-size: calc(var(--u) * var(--fs));
    line-height: 1;
    white-space: nowrap;
  }
  svg { overflow: visible; fill: none; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .sz { width: calc(var(--u) * var(--w)); height: calc(var(--u) * var(--h)); }

  /* Title bar */
  .titlebar {
    position: relative;
    flex: none;
    height: calc(var(--u) * 76);
    background: linear-gradient(90deg,
      #2c59b7 0,
      #2c59b7 calc(100% - var(--u) * 620),
      #274fa3 calc(100% - var(--u) * 360),
      #264d9f calc(100% - var(--u) * 170),
      #2851a6 100%);
    box-shadow: inset 0 calc(var(--u) * 2) 0 rgba(255, 255, 255, 0.45);
  }
  .light { border-radius: 50%; box-shadow: inset 0 0 0 calc(var(--u) * 1) rgba(0, 0, 0, 0.12); }
  .light.red { background: #ec6765; }
  .light.yellow { background: #f2ca44; }
  .light.green { background: #65c466; }
  .light.red::after {
    content: "";
    position: absolute;
    left: 50%; top: 50%;
    width: calc(var(--u) * 9);
    height: calc(var(--u) * 9);
    border-radius: 50%;
    background: #763433;
    transform: translate(-50%, -50%);
  }
  .autosave {
    color: rgba(255, 255, 255, 0.86);
    font-weight: 500;
    transform: translate(-100%, -50%);
  }
  .toggle {
    border-radius: 999px;
    background: #2850a4;
    box-shadow: inset 0 0 0 calc(var(--u) * 2) rgba(225, 233, 248, 0.75);
  }
  .toggle::after {
    content: "";
    position: absolute;
    left: calc(var(--u) * 5);
    top: calc(var(--u) * 5);
    width: calc(var(--u) * 42);
    height: calc(var(--u) * 26);
    border-radius: 999px;
    background: #ffffff;
  }
  .wi { stroke: #ffffff; }
  .rgroup {
    position: absolute;
    right: calc(var(--u) * 16);
    top: calc(var(--u) * 12);
    height: calc(var(--u) * 56);
    display: flex;
    align-items: center;
    gap: calc(var(--u) * 16);
  }
  .rgroup .comment { margin-right: calc(var(--u) * 12); }
  .pill {
    height: calc(var(--u) * 56);
    border-radius: 999px;
    display: flex;
    align-items: center;
    font-size: calc(var(--u) * 26);
    font-weight: 500;
    line-height: 1;
    white-space: nowrap;
  }
  .pill.editing {
    color: #ffffff;
    padding: 0 calc(var(--u) * 14) 0 calc(var(--u) * 20);
    background: linear-gradient(90deg, #3d6ede, #3a68d3);
    box-shadow: inset 0 0 0 calc(var(--u) * 2) rgba(124, 186, 241, 0.9);
  }
  .pill.editing .label { margin: 0 calc(var(--u) * 20) 0 calc(var(--u) * 14); }
  .pill.share {
    color: #242424;
    padding: 0 calc(var(--u) * 14) 0 calc(var(--u) * 22);
    background: linear-gradient(90deg, #b5c4e4, #acbad9);
    box-shadow: inset 0 0 0 calc(var(--u) * 2) rgba(214, 230, 247, 0.95);
  }
  .pill.share .label { margin: 0 calc(var(--u) * 20) 0 calc(var(--u) * 11); }
  .pill.share svg { stroke: #242424; }
  .circle {

    height: calc(var(--u) * 56);
    border-radius: 50%;
    display: grid;
    place-items: center;
  }
  .circle.search {
    background: linear-gradient(90deg, #3d6edd, #3968d1);
    box-shadow: inset 0 0 0 calc(var(--u) * 2) rgba(124, 185, 240, 0.9);

  .tabs {

    background: #f5f5f5;

    box-sizing: content-box;
    overflow: hidden;
    color: #242424;
  }

  /* Document canvas */
  .canvas {
    flex: 1;
    min-height: 0;
    overflow: auto;
    background: #f5f5f5;
    padding: calc(var(--u) * 59) 0;
  }
  .page {
    position: relative;
    width: calc(var(--u) * 1224);
    height: calc(var(--u) * 1584);
    margin: 0 auto;
    padding: calc(var(--u) * 144);
    background: #ffffff;
    box-shadow:
      0 0 0 calc(var(--u) * 2) #c6c6c6,
      calc(var(--u) * 3) calc(var(--u) * 4) calc(var(--u) * 8) rgba(0, 0, 0, 0.06);
  }
  .video {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #fefefe;
    overflow: hidden;
  }
  .video video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    background: transparent;
  }
  .poster {
    position: absolute;
    inset: -2px;
    width: calc(100% + 4px);
    height: calc(100% + 4px);
    border: 0;
    padding: 0;
    background: #fefefe;
    cursor: pointer;
    display: block;
    -webkit-tap-highlight-color: transparent;
  }
  .poster[hidden] { display: none; }
  .poster img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .play {
    position: absolute;
    left: 4%;
    top: 67%;
    width: 11%;
    aspect-ratio: 1;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.55);
    display: grid;
    place-items: center;
    opacity: 0;
    transition: opacity 0.2s ease;
  }
  .play svg { width: 36%; height: 36%; margin-left: 8%; fill: #ffffff; }
  .poster:hover .play,
  .poster:focus-visible .play { opacity: 1; }
  @media (hover: none) {
    .play { opacity: 0.85; }
  }

  /* Status bar */
  .status {
    position: relative;
    flex: none;
    height: calc(var(--u) * 54);
    background: #f5f5f5;
    border-top: calc(var(--u) * 2) solid #d1d1d1;
    box-sizing: content-box;
    color: #606060;
  }
  .gi { stroke: #606060; }
  .viewbtn { background: #b8b8b8; border-radius: calc(var(--u) * 10); }
  .zoom {
    position: absolute;
    right: 0;
    top: 0;
    width: calc(var(--u) * 406);
    height: 100%;
  }
  .track { background: #ababab; border-radius: 999px; }
  .knob {
    background: #ffffff;
    border-radius: 999px;
    box-shadow: 0 calc(var(--u) * 1) calc(var(--u) * 4) rgba(0, 0, 0, 0.22), 0 0 0 calc(var(--u) * 0.5) rgba(0, 0, 0, 0.08);
  }
  .bar { background: #606060; border-radius: 999px; }

  /* iPhone and other small screens: the window becomes the whole screen,
     the page fits the width, and the video plays full screen when tapped. */
  @media (max-width: 600px), (max-height: 500px) {
    body { display: block; background: #f5f5f5; }

      width: 100%;
      height: 100vh;
      border-radius: 0;

    }

    .canvas { padding: 10px; }
    .page {

      aspect-ratio: 8.5 / 11;
      max-width: calc((100vh - var(--u) * 196 - 24px) / 0.56);

    }
    @supports (height: 100dvh) {
      .win {
        --u: calc(min(100vw, 100dvh) / 930);
        height: 100dvh;
      }
      .page { max-width: calc((100dvh - var(--u) * 196 - 24px) / 0.56); }
    }
  }
</style>

<script>
  var video = document.getElementById("v");
  var poster = document.querySelector(".poster");

  // Tap or click the thumbnail to play. On iPhone the video opens full screen.
  poster.addEventListener("click", function () {
    poster.hidden = true;
    video.controls = true;
    var p = video.play();
    if (p && p.catch) p.catch(function () {});
  });

  // When it finishes, go back to the thumbnail.
  video.addEventListener("ended", function () {
    video.controls = false;
    video.currentTime = 0;
    poster.hidden = false;
  });
</script>
