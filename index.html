<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emily Doing Role Plays Inside a Word Doc</title>
<style>
  :root {
    --bg: #f5f5f7;
    --ink: #1d1d1f;
    --soft: #6e6e73;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000;
      --ink: #f5f5f7;
      --soft: #86868b;
    }
    main .player { box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08); }
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6vh 5vw;
  }
  main {
    width: 100%;
    max-width: 1120px;
  }
  .player {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: 18px;
    overflow: hidden;
    background: #000;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.18);
  }
  .player iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }
  h1 {
    margin-top: 28px;
    text-align: center;
    font-size: 19px;
    font-weight: 500;
    letter-spacing: -0.01em;
    color: var(--soft);
  }
  @media (max-width: 600px) {
    body { padding: 24px 16px; }
    .player { border-radius: 12px; }
    h1 { font-size: 16px; margin-top: 20px; }
  }
</style>
</head>
<body>
<main>
  <div class="player">
    <iframe
      src="https://www.youtube-nocookie.com/embed/9ND6PYUZAts?rel=0&playsinline=1"
      title="Emily Doing Role Plays Inside a Word Doc"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen></iframe>
  </div>
  <h1>Emily Doing Role Plays Inside a Word Doc</h1>
</main>
</body>
</html>
